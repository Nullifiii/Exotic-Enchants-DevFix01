name: Build ExoticEnchants
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExoticEnchants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14
      - name: Build and run tests
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ExoticStreakFix1
          path: ExoticEnchants/build/libs/ExoticEnchants-*.jar
